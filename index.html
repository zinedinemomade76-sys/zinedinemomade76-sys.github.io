<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meus Jogos Zerados</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#16191D">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#16191D;--card:#20252B;--tx:#ECEEF0;--mut:#9AA3AD;--ac:#5FB3A5;--acx:#0F1A18;--bd:#2C333B;--bad:#E5756F;--ok:#6CC28E;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:dark}
:root[data-theme="light"]{--bg:#F4F6F7;--card:#FFFFFF;--tx:#1B2127;--mut:#5C6670;--ac:#277A6E;--acx:#FFFFFF;--bd:#E1E5E8;--bad:#C4423B;--ok:#1F8A55;color-scheme:light}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 100px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
h1{font-size:20px;margin:0}h2{font-size:16px;margin:0 0 10px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}
.mut{color:var(--mut);font-size:14px}
input[type=text],input[type=password],input[type=email]{width:100%;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:16px;margin-bottom:10px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:var(--ac);color:var(--acx);font-weight:600}
button.ghost{background:transparent;color:var(--mut);border:1px solid var(--bd)}
button.sm{padding:6px 10px;font-size:14px}
.stats{display:flex;gap:10px}.stat{flex:1;text-align:center}.stat b{display:block;font-size:26px;color:var(--ac)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--bd)}
.row:first-child{border-top:0}
.name{font-weight:600}
.badge{background:var(--ac);color:var(--acx);border-radius:8px;padding:2px 8px;font-weight:700;font-size:14px}
.err{color:var(--bad);font-size:14px;min-height:18px;margin:0 0 8px}
.err.ok{color:var(--ok)}
.tabs,.seg{display:flex;gap:8px;margin-bottom:12px}.tabs button,.seg button{flex:1}
.seg button{background:transparent;color:var(--mut);border:1px solid var(--bd)}
.seg button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.hide{display:none}
.mini{display:flex;justify-content:flex-end;gap:8px;margin-bottom:8px}
input[type=range]{width:100%;accent-color:var(--ac)}
.rate{display:flex;align-items:center;gap:12px}.rate{gap:6px}.rate input[type=range]{flex:1;min-width:0}.rate .arw{flex:none;width:40px;height:40px;padding:0;margin:0;font-size:15px;line-height:1;touch-action:manipulation;user-select:none}.rate input.num{flex:none;width:74px;box-sizing:border-box;margin:0;padding:8px 6px;font-size:22px;font-weight:700;color:var(--ac);text-align:center}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(calc(100% - 32px),420px);display:flex;justify-content:space-between;align-items:center;gap:4px;background:var(--card);border:1px solid var(--bd);border-radius:999px;padding:8px;box-shadow:0 8px 28px rgba(0,0,0,.35);z-index:5}
nav button{flex:none;background:transparent;color:var(--mut);border-radius:999px;height:48px;min-width:48px;padding:0 14px;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px}
nav button.on{background:var(--ac);color:var(--acx);padding:0 20px}
nav .ic{display:flex;line-height:0}nav .ic svg{width:24px;height:24px}
nav .lb{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
nav button.on .lb{position:static;width:auto;height:auto;overflow:visible;clip:auto}
.cv{width:44px;height:58px;border-radius:8px;object-fit:cover;flex:none;background:var(--bd)}
.ph{display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff}
.it{display:flex;align-items:center;gap:10px;min-width:0}
@keyframes pgIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.pgin,#pend:not(.hide){animation:pgIn .3s ease both}
button{transition:transform .1s,background .2s,color .2s}
button:active{transform:scale(.96)}
@media (prefers-reduced-motion:reduce){.pgin,#pend:not(.hide){animation:none}button{transition:none}}
.wrap{position:relative;z-index:1}
.nts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.nt{display:flex;flex-direction:column;align-items:center;text-align:center;padding:10px 6px;border-radius:12px;background:var(--bg);min-width:0}
.nt b{font-size:28px;line-height:1.1;margin:4px 0}
.nt small{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nt.lo b{color:var(--bad)}.nt.hi b{color:var(--ok)}.nt.mid b{color:var(--ac)}
.bar{display:flex;height:10px;border-radius:6px;overflow:hidden;margin:14px 0 8px;background:var(--bd)}
.bar i{display:block;height:100%}
.leg{display:flex;justify-content:space-between;gap:6px;font-size:13px;color:var(--mut);flex-wrap:wrap}
.av{width:44px;height:44px;border-radius:50%}
nav button{position:relative}
.bdg{position:absolute;top:2px;right:2px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font:700 11px/18px system-ui,sans-serif;text-align:center;padding:0 4px;font-style:normal}
#toast{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:20;background:var(--ac);color:var(--acx);padding:12px 14px;border-radius:12px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.3);cursor:pointer}
/* ===== Filtros / pastas ===== */
.fl-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:12px 0 6px}
.fl-h:first-child{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 12px;border-radius:999px;background:transparent;color:var(--mut);border:1px solid var(--bd);font-size:14px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip b{margin-left:4px;font-size:12px;opacity:.75}
.chip.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
#fAct{display:flex;gap:8px;margin-top:8px}
.tag{display:inline-block;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
#sheet{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
#sheet.hide{display:none}
#shPn{width:min(560px,100%);max-height:80vh;overflow:auto;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));animation:pgIn .25s ease both}
#shPn button.opt{display:block;width:100%;text-align:left;background:transparent;color:var(--tx);border:1px solid var(--bd);margin-bottom:8px;font-weight:500}
#shPn button.opt.on{border-color:var(--ac);color:var(--ac);font-weight:700}
#shPn input{margin-bottom:6px}

/* ===== Foto e bio ===== */
.pc{display:flex;gap:14px;align-items:center}
.pc .cv{width:72px;height:72px;border-radius:50%;font-size:24px}
.pc .bio{margin:4px 0 0;white-space:pre-wrap;word-break:break-word;color:var(--mut);font-size:14px}
.pc h2{margin:0}
textarea#bio{width:100%;min-height:84px;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;font-size:16px;resize:vertical;margin-bottom:6px}
/* ===== Tela de login (gamer / dark) ===== */
body.authing{overflow:hidden}
#auth{position:fixed;inset:0;z-index:8;background:#16191D;color:#ECEEF0;align-items:center;justify-content:center;padding:clamp(0px,3vw,32px);overflow:hidden;--a1:#3E8F83;--a2:#5FB3A5;--a3:#8BD0C4}
#auth:not(.hide){display:flex}
#auth .sl{position:absolute;inset:0;background-size:cover;background-position:var(--p,center);opacity:0;transform:scale(1);transition:opacity 1.6s ease,transform 0s 1.6s}
#auth .sl.on{opacity:1;transform:scale(1.1);transition:opacity 1.6s ease,transform 9s linear}
.a-amb{position:absolute;inset:-60px;filter:blur(40px) brightness(.4) saturate(1)}
.a-frame{position:relative;width:min(1080px,100%);height:min(660px,100%);display:grid;grid-template-columns:1.05fr 1fr;border:1px solid rgba(255,255,255,.16);border-radius:24px;overflow:hidden;background:rgba(22,25,29,.78);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 0 0 1px rgba(95,179,165,.16),0 30px 90px rgba(0,0,0,.75),0 0 70px rgba(95,179,165,.2)}
.a-frame::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;z-index:4;background:linear-gradient(90deg,transparent,var(--a1),var(--a2),var(--a3),transparent)}
.a-hero{position:relative;min-height:0;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,#000 60%,transparent 100%);mask-image:linear-gradient(90deg,#000 60%,transparent 100%)}
.a-hero .sl{filter:brightness(.8) contrast(1.08) saturate(1.1)}
.a-hero::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px),linear-gradient(0deg,rgba(5,6,10,.85),transparent 40%)}
.a-dots{position:absolute;left:24px;bottom:22px;z-index:3;display:flex;gap:8px}
.a-dots button{width:28px;height:4px;padding:0;border-radius:2px;background:rgba(255,255,255,.28);transition:background .3s,box-shadow .3s}
.a-dots button.on{background:var(--a2)}
.a-main{position:relative;z-index:2;display:flex;flex-direction:column;min-width:0;min-height:0;padding:22px 34px 26px;overflow:auto}
.a-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.a-brand{font-weight:800;font-size:13px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.a-act{display:flex;align-items:center;gap:10px}
#auth .a-lang{background:transparent;color:#9AA3AD;border:0;padding:6px 4px;font-size:12px;letter-spacing:.08em}
.atabs{display:flex;gap:6px;margin:0}
#auth .atabs button{flex:none;padding:6px 14px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.06em;border:0;background:var(--a2);color:#0F1A18}
#auth .atabs button.ghost{background:transparent;color:#9AA3AD}
.a-form{width:min(380px,100%);margin:auto;padding:18px 0}
#auth h1{font-size:clamp(26px,3.4vw,34px);line-height:1.1;text-transform:uppercase;letter-spacing:.06em;font-weight:800;color:#ECEEF0;margin:0 0 6px}
.a-sub{margin:0 0 20px;color:#9AA3AD;font-size:14px}
.a-f{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:0 12px;margin-bottom:12px;transition:border-color .2s,box-shadow .2s;color:#9AA3AD}
.a-f:focus-within{border-color:var(--a2);box-shadow:0 0 0 3px rgba(95,179,165,.14);color:var(--a2)}
.a-f svg{flex:none;width:18px;height:18px}
#auth .a-f input{background:transparent;border:0;outline:0;margin:0;padding:14px 0;color:#ECEEF0;font-size:16px;min-width:0}
#auth .a-f input::placeholder{color:#7C8590}
#auth .a-eye{background:transparent;color:#9AA3AD;padding:4px;border-radius:8px;line-height:0}
#auth .a-eye svg{width:20px;height:20px}
#auth .err{color:#E5756F;min-height:20px;margin:0 0 10px}
#auth #aok{width:100%;padding:14px;border-radius:12px;background:var(--a2);color:#0F1A18;font-weight:800;letter-spacing:.16em;text-transform:uppercase;box-shadow:none;transition:filter .2s,box-shadow .2s,transform .1s}
#auth #aok:hover{filter:brightness(1.08);box-shadow:none}
#auth #aok:disabled{opacity:.6;cursor:wait}
.a-or{display:flex;align-items:center;gap:10px;margin:18px 0 12px;color:#7C8590;font-size:12px;text-align:center}
.a-or::before,.a-or::after{content:"";flex:1;height:1px;background:rgba(255,255,255,.14)}
.a-alt{margin:0;text-align:center;font-size:14px;color:#9AA3AD}
.a-alt a{color:#ECEEF0;font-weight:800;text-decoration:none;border-bottom:1px solid var(--a3);padding-bottom:1px}
@media (max-width:860px){
  #auth{padding:0}
  .a-frame{grid-template-columns:1fr;width:100%;height:100%;border:0;border-radius:0}
  .a-hero{position:absolute;left:0;right:0;top:0;height:68%;-webkit-mask-image:linear-gradient(180deg,#000 55%,transparent 100%);mask-image:linear-gradient(180deg,#000 55%,transparent 100%)}
  .a-hero::after{background:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px)}
  .a-top{flex-wrap:nowrap}.a-brand{font-size:11px;letter-spacing:.08em}
  #auth .atabs button{padding:6px 10px}.a-act{gap:4px}
  .a-form{margin:auto 0 0}
  .a-dots{display:none}
  .a-main{padding:calc(16px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px))}
  .a-form{background:rgba(22,25,29,.82);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:22px 18px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
}
@media (prefers-reduced-motion:reduce){#auth .sl.on{transform:none}#auth .sl{transition:opacity 1.6s ease}}
.gh{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:20px 4px 8px;font-weight:600}
.srows{padding:2px 16px}
.srow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--bd)}
.srow:first-child{border-top:0}
.sl{font-size:15px;flex:1}
.sg{margin:0}.sg button{padding:6px 12px;font-size:13px;flex:none}
.ib{width:44px;height:36px;padding:0;display:flex;align-items:center;justify-content:center;flex:none}
.pn{font-size:18px;font-weight:700}
.hint{margin:0 0 8px;font-size:13px}
.sw{appearance:none;-webkit-appearance:none;width:46px;height:26px;border-radius:13px;background:var(--bd);position:relative;cursor:pointer;border:0;transition:background .2s;flex:none;margin:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--tx);transition:left .2s}
.sw:checked{background:var(--ac)}.sw:checked::after{left:23px;background:var(--acx)}
.dt{border-top:1px solid var(--bd)}.dt:first-child{border-top:0}
.dt summary{cursor:pointer;padding:14px 0;font-size:15px;list-style:none;display:flex;justify-content:space-between;align-items:center}
.dt summary::-webkit-details-marker{display:none}
.dt summary::after{content:"›";color:var(--mut);font-size:20px;transition:transform .2s}
.dt[open] summary::after{transform:rotate(90deg)}
.dtb{padding:0 0 14px}
/* ===== Zerados em grelha ===== */
.gg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 12px}
.gg>p{grid-column:1/-1}
.gi{min-width:0}
.gc{position:relative}
.gg .cv{width:100%;height:auto;aspect-ratio:6/5;border-radius:18px}
.gg .cv.ph{font-size:34px}
.gb{position:absolute;top:8px;right:8px;background:rgba(22,25,29,.88);color:#fff;border-radius:999px;padding:3px 10px;font-weight:700;font-size:14px}
.gn{margin-top:8px;line-height:1.25;overflow-wrap:anywhere}
.gd{font-size:13px}
.ga{display:flex;gap:6px;margin-top:6px}
.ia{width:34px;height:30px;padding:0;display:flex;align-items:center;justify-content:center}
.ia svg{width:16px;height:16px;pointer-events:none}
/* ===== Transição login <-> app ===== */
@keyframes authOut{0%{opacity:1;transform:scale(1);filter:blur(0)}100%{opacity:0;transform:scale(1.08);filter:blur(10px)}}
@keyframes authIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes appIn{from{opacity:0;transform:translateY(28px) scale(.98)}to{opacity:1;transform:none}}
@keyframes navIn{from{opacity:0;transform:translate(-50%,48px)}to{opacity:1;transform:translateX(-50%)}}
#auth.leaving{animation:authOut .7s cubic-bezier(.4,0,.2,1) forwards;pointer-events:none}
#auth.authin{animation:authIn .5s ease both}
#app.appin{animation:appIn .7s .15s cubic-bezier(.2,.8,.2,1) both}
nav.navin{animation:navIn .7s .3s cubic-bezier(.2,.8,.2,1) both}
@media (prefers-reduced-motion:reduce){#auth.leaving,#auth.authin,#app.appin,nav.navin{animation:none}}
/* ===== Vista para computador (>=900px): menu lateral + conteúdo mais largo ===== */
@keyframes navInD{from{opacity:0;transform:translateX(-32px)}to{opacity:1;transform:none}}
@media (min-width:900px){
  body:has(#nav:not(.hide)){padding-left:232px}
  .wrap{max-width:1120px;padding:36px 40px 56px}
  h1{font-size:28px}
  .top{margin-bottom:22px}
  #pg-search,#pg-fr,#pg-prof,#frDet,#view #vBody{max-width:760px}
  #pg-done,#frDet{max-width:none}
  #pg-search,#pg-fr,#pg-prof{margin-left:0}
  nav{left:0;top:0;bottom:0;transform:none;width:232px;border-radius:0;border:0;border-right:1px solid var(--bd);flex-direction:column;justify-content:flex-start;align-items:stretch;gap:6px;padding:28px 14px;box-shadow:none}
  nav::before{content:"Meus Jogos Zerados";display:block;font-weight:800;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);padding:0 16px 18px}
  nav button{width:100%;justify-content:flex-start;height:46px;padding:0 16px}
  nav button.on{padding:0 16px}
  nav button:not(.on):hover{background:var(--bg);color:var(--tx)}
  nav .lb,nav button.on .lb{position:static;width:auto;height:auto;overflow:visible;clip:auto}
  nav.navin{animation-name:navInD}
  .bdg{top:50%;right:14px;margin-top:-9px}
  .gg{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:22px 18px}
  .chip:hover,button.ghost:hover{border-color:var(--ac)}
  #toast{left:calc(232px + 24px);right:24px;max-width:520px}
}
/* ===== Histórico / sugestões / sobre ===== */
#sug:empty{display:none}
#sug{margin:-2px 0 10px}
.sugl{border:1px solid var(--bd);border-radius:12px;overflow:hidden}
.sugl button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;color:var(--tx);border-radius:0;font-weight:500;padding:11px 12px;border-top:1px solid var(--bd)}
.sugl button:first-child{border-top:0}
.sugl svg{width:16px;height:16px;flex:none;color:var(--mut);pointer-events:none}
.sugl b{color:var(--ac)}
.hchip{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.hchip .hx{opacity:.6;font-size:12px;padding:0 2px}
.how{margin:0;padding-left:20px;font-size:14px;color:var(--mut)}
.how li{margin-bottom:8px}
</style>
</head>
<body>
<div id="toast" class="hide" role="status"></div>
<div class="wrap">

<section id="auth" class="hide" aria-label="Login">
  <div class="a-amb" id="aAmb" aria-hidden="true"></div>
  <div class="a-frame">
    <div class="a-hero" id="aHero" aria-hidden="true"></div>
    <div class="a-dots" id="aDots"></div>
    <div class="a-main">
      <header class="a-top">
        <div class="a-brand">Meus Jogos Zerados</div>
        <div class="a-act">
          <button class="a-lang" id="aLang" type="button">EN</button>
          <div class="atabs"><button id="tLogin" type="button" data-i="login"></button><button id="tReg" class="ghost" type="button" data-i="reg"></button></div>
        </div>
      </header>
      <form class="a-form" id="aForm" novalidate>
        <h1 id="aHi" data-i="hiLogin"></h1>

function handleAuthHash(){

  const q=new URLSearchParams(h),ty=q.get("type"),tok=q.get("access_token");
  if(!ty&&!q.get("error")&&!q.get("error_code"))return;

const hKey=()=>"jf_hist_"+me;
const getHist=()=>{const h=me?load(hKey(),[]):[];return Array.isArray(h)?h:[]};
function rememberQ(v){
  v=String(v||"").trim().replace(/\s+/g," ");if(v.length<2||!me)return;
  const n=norm(v);let H=getHist().filter(h=>{const m=norm(h);return m!==n&&!n.startsWith(m)});
  H.unshift(v);save(hKey(),H.slice(0,10));paintSug();
}
function paintSug(){
  const box=$("sug"),raw=$("q").value.trim(),q=norm(raw),H=getHist();
  if(!q){
    box.innerHTML=H.length?`<div class="fl-h"><span class="mut">${t("hRecent")}</span><button class="ghost sm" data-hc="1" type="button">${t("hClear")}</button></div><div class="chips">`+H.map((h,i)=>`<span class="chip hchip"><span data-h="${i}">${esc(h)}</span><span class="hx" data-hx="${i}">✕</span></span>`).join("")+"</div>":"";
    return;
  }
  const r0=[],r1=[],seen=new Set([q]);
  const add=nm=>{const n=norm(nm);if(seen.has(n))return;
    if(n.startsWith(q)){seen.add(n);r0.push(nm)}
    else if(n.includes(" "+q)||n.includes(": "+q)){seen.add(n);r1.push(nm)}};
  H.forEach(add);CAT.forEach(add);
  const L=[...r0.slice(0,H.length).concat(r0.slice(H.length).sort((x,y)=>x.length-y.length)),...r1].slice(0,5);
  const ico='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>';
  const hl=nm=>{const n=norm(nm),i=n.indexOf(q);return n.length===nm.length&&i>=0?esc(nm.slice(0,i))+"<b>"+esc(nm.slice(i,i+q.length))+"</b>"+esc(nm.slice(i+q.length)):esc(nm)};
  box.innerHTML=L.length?'<div class="sugl">'+L.map(nm=>`<button type="button" data-s="${esc(nm)}">${ico}<span>${hl(nm)}</span></button>`).join("")+"</div>":"";
}
$("sug").onclick=e=>{
  const b=e.target.closest("[data-s],[data-h],[data-hx],[data-hc]");if(!b)return;
  const H=getHist();
  if(b.dataset.hc!==undefined){save(hKey(),[]);paintSug();return}
  if(b.dataset.hx!==undefined){H.splice(+b.dataset.hx,1);save(hKey(),H);paintSug();return}
  const v=b.dataset.s!==undefined?b.dataset.s:H[+b.dataset.h];if(!v)return;

/* nota de 0 a 10 com 1 casa decimal (ex.: 8.3): barra e caixa numérica ficam sincronizadas */
const rd1=v=>{v=parseFloat(String(v).replace(",","."));return isNaN(v)?null:Math.min(10,Math.max(0,Math.round(v*10)/10))};
function bindScore(rid,nid){
  $(rid).oninput=()=>{$(nid).value=$(rid).value};
  $(nid).oninput=()=>{const v=rd1($(nid).value);if(v!==null)$(rid).value=v};
  $(nid).onblur=()=>{const v=rd1($(nid).value);$(nid).value=v===null?$(rid).value:v;$(rid).value=$(nid).value};
  /* setinhas: ◀ baixa 0,1 e ▶ sobe 0,1 (segurando, repete) */
  const bump=d=>{const v=rd1($(nid).value);const n=rd1((v===null?parseFloat($(rid).value):v)+d);$(nid).value=n;$(rid).value=n};
  const mk=(txt,d,lbl)=>{const b=document.createElement("button");b.type="button";b.className="arw ghost";b.textContent=txt;b.setAttribute("aria-label",lbl);
    let t1,t2;const stop=()=>{clearTimeout(t1);clearInterval(t2)};
    b.onpointerdown=e=>{e.preventDefault();bump(d);t1=setTimeout(()=>{t2=setInterval(()=>bump(d),90)},400)};
    ["pointerup","pointerleave","pointercancel"].forEach(ev=>b.addEventListener(ev,stop));
    b.onclick=e=>e.preventDefault();return b};
  $(nid).before(mk("◀",-0.1,"Diminuir nota"));$(nid).after(mk("▶",0.1,"Aumentar nota"));
}

const OT={};
function otherInit(k,g,fo){
  OT[k]={g,fo:fo&&Array.isArray(fo.f)?{f:fo.f,m:fo.m&&typeof fo.m==="object"?fo.m:{}}:{f:[],m:{}},y:"all",f:"all"};
  $(k+"Q").value="";otherRender(k);
}
function otherRender(k){
  const s=OT[k];if(!s)return;
  const q=norm($(k+"Q").value),fid=x=>{const id=s.fo.m[x.id];return s.fo.f.some(f=>f.id===id)?id:""};
  const okY=(x,y)=>y==="all"||yrOf(x)===y,okF=(x,f)=>f==="all"||(f==="none"?!fid(x):fid(x)===f);
  const ys=[...new Set(s.g.map(yrOf).filter(Boolean))].sort((a,b)=>b-a);
  if(s.y!=="all"&&!ys.includes(s.y))s.y="all";
  if(s.f!=="all"&&s.f!=="none"&&!s.fo.f.some(f=>f.id===s.f))s.f="all";
  const chip=(a,v,cur,l,n)=>`<button type="button" class="chip${v===cur?" on":""}" ${a}="${esc(v)}">${l}<b>${n}</b></button>`;
  let h="";
  if(ys.length)h+=`<div class="fl-h"><span class="mut">${t("fYear")}</span></div><div class="chips">`+chip("data-oy","all",s.y,t("fAll"),s.g.filter(x=>okF(x,s.f)).length)+ys.map(y=>chip("data-oy",y,s.y,y,s.g.filter(x=>okY(x,y)&&okF(x,s.f)).length)).join("")+"</div>";
  const byY=s.g.filter(x=>okY(x,s.y));
  if(s.fo.f.length)h+=`<div class="fl-h"><span class="mut">${t("fFold")}</span></div><div class="chips">`+chip("data-of","all",s.f,t("fAllF"),byY.length)+chip("data-of","none",s.f,t("fNone"),byY.filter(x=>!fid(x)).length)+s.fo.f.map(f=>chip("data-of",f.id,s.f,"📁 "+esc(f.n),byY.filter(x=>fid(x)===f.id).length)).join("")+"</div>";
  $(k+"Chips").innerHTML=h;$(k+"Chips").style.marginBottom=h?"12px":"0";$(k+"Q").classList.toggle("hide",!s.g.length);
  const view=s.g.filter(x=>okY(x,s.y)&&okF(x,s.f));
  $(k+"Tot").textContent=view.length;$(k+"Notes").innerHTML=notesHTML(view);
  const items=view.filter(x=>norm(x.name).includes(q)).reverse();
  const fn=x=>{const o=s.fo.f.find(z=>z.id===fid(x));return o?` · <span class="tag">📁 ${esc(o.n)}</span>`:""};
  $(k+"List").innerHTML=items.length?'<div class="gg">'+items.map(x=>`<div class="gi"><div class="gc">${cvHtml(x.name,x.cover)}<span class="gb">${x.score}</span></div><div class="name gn">${esc(x.name)}</div><div class="mut gd">${esc(x.date||"")}${fn(x)}</div></div>`).join("")+"</div>":'<p class="mut">'+t(s.g.length?"none":"empty")+"</p>";
}

      const d=r.ok?await r.json():[];

      const reg=await navigator.serviceWorker.getRegistration();
      if(reg)reg.showNotification("Meus Jogos Zerados",{body:msg,icon:"icon-192.png"});

  }catch(e){}

function prevCv(){if(pending)$("pcv").innerHTML=cvHtml(pending,pendCover)}
$("cvUrl").oninput=()=>{const v=$("cvUrl").value.trim();pendCover=/^https?:\/\//i.test(v)?v:"";prevCv()};
$("cvPick").onclick=()=>$("cvFile").click();
$("cvFile").onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{const im=new Image();
    im.onload=()=>{const k=Math.min(1,320/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);pendCover=c.toDataURL("image/jpeg",.8);$("cvUrl").value="";$("cvMsg").textContent="";prevCv()};
    im.onerror=()=>{$("cvMsg").textContent=t("cvBad")};
    im.src=rd.result};
  rd.onerror=()=>{$("cvMsg").textContent=t("cvBad")};
  rd.readAsDataURL(f);e.target.value="";
};
/* ---- Adicionar jogo manualmente (nome, capa e nota) ---- */
let mCover="";
const mPrev=()=>{$("mCv").innerHTML=cvHtml($("mName").value.trim()||"?",mCover)};
function mReset(){$("mName").value="";$("mUrl").value="";$("mScore").value=8;$("mSv").value=8;mCover="";mPrev()}
$("mDet").addEventListener("toggle",()=>{if($("mDet").open){mPrev();$("mMsg").textContent=""}});
$("mName").oninput=mPrev;
bindScore("mScore","mSv");
$("mUrl").oninput=()=>{const v=$("mUrl").value.trim();mCover=/^https?:\/\//i.test(v)?v:"";mPrev()};
$("mPick").onclick=()=>$("mFile").click();
$("mFile").onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{const im=new Image();
    im.onload=()=>{const k=Math.min(1,320/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);mCover=c.toDataURL("image/jpeg",.8);$("mUrl").value="";$("mMsg").textContent="";mPrev()};
    im.onerror=()=>{$("mMsg").className="err";$("mMsg").textContent=t("cvBad")};
    im.src=rd.result};
  rd.onerror=()=>{$("mMsg").className="err";$("mMsg").textContent=t("cvBad")};
  rd.readAsDataURL(f);e.target.value="";
};
$("mSave").onclick=async()=>{
  const n=$("mName").value.trim().replace(/\s+/g," "),m=$("mMsg");m.className="err";
  if(!n){m.textContent=t("mNeed");return}
  if(me_().games.some(x=>norm(x.name)===norm(n))){m.textContent=t("mDup");return}
  const row={name:n,cover:mCover||null,score:rd1($("mSv").value)??rd1($("mScore").value)??8,date:new Date().toLocaleDateString(prefs.lang==="en"?"en-GB":"pt-PT")};
  $("mSave").disabled=true;
  try{
    const r=await sb("/rest/v1/games",{method:"POST",headers:{Prefer:"return=representation"},body:JSON.stringify(row)});
    if(!r.ok)throw 0;
    const d=await r.json();U.games.push(d[0]);
  }catch(e){m.textContent=t("eNet");$("mSave").disabled=false;return}
  $("mSave").disabled=false;
  mReset();m.className="err ok";m.textContent=t("mOk");render();search();
};
